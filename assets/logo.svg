<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="precedent">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe3ee"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3c9dc"/>
      <stop offset="1" stop-color="#eef0f7"/>
    </linearGradient>
    <radialGradient id="wax" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#8b8ef7"/>
      <stop offset="0.55" stop-color="#5b5ee6"/>
      <stop offset="1" stop-color="#33348f"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4ec9"/>
      <stop offset="1" stop-color="#2c2d7a"/>
    </linearGradient>
  </defs>

  <!-- ribbons, tucked under the seal -->
  <g fill="url(#ribbon)">
    <path d="M38 47 L30 60 L37 58 L40 63 L46 50 Z"/>
    <path d="M50 47 L58 60 L51 58 L48 63 L42 50 Z"/>
  </g>

  <g transform="rotate(-4 32 32)">
    <!-- cast shadow -->
    <path d="M13 7 h27 l9 9 v33 h-36 z" fill="#0b1020" opacity="0.22" transform="translate(1.5 2.5)"/>
    <!-- page with folded corner -->
    <path d="M13 7 h27 l9 9 v33 a2 2 0 0 1 -2 2 h-32 a2 2 0 0 1 -2 -2 v-40 a2 2 0 0 1 2 -2 z" fill="url(#paper)"/>
    <path d="M40 7 l9 9 h-9 z" fill="url(#fold)"/>

    <!-- checklist: settled rulings -->
    <g>
      <rect x="18" y="20" width="6" height="6" rx="1.5" fill="#eceef6" stroke="#aab0c6" stroke-width="0.9"/>
      <path d="M19.4 23 l1.7 1.8 l3-3.6" fill="none" stroke="#4f52d8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="27" y="21.6" width="16" height="2.6" rx="1.3" fill="#b6bcd0"/>

      <rect x="18" y="30" width="6" height="6" rx="1.5" fill="#eceef6" stroke="#aab0c6" stroke-width="0.9"/>
      <path d="M19.4 33 l1.7 1.8 l3-3.6" fill="none" stroke="#4f52d8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="27" y="31.6" width="13" height="2.6" rx="1.3" fill="#b6bcd0"/>

      <rect x="18" y="40" width="6" height="6" rx="1.5" fill="#eceef6" stroke="#aab0c6" stroke-width="0.9"/>
      <path d="M19.4 43 l1.7 1.8 l3-3.6" fill="none" stroke="#4f52d8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="27" y="41.6" width="15" height="2.6" rx="1.3" fill="#b6bcd0"/>
    </g>
  </g>

  <!-- wax seal -->
  <g>
    <circle cx="44" cy="47" r="13" fill="#0b1020" opacity="0.2" transform="translate(1 1.5)"/>
    <circle cx="44" cy="47" r="13" fill="url(#wax)"/>
    <circle cx="44" cy="47" r="10.2" fill="none" stroke="#2e2f85" stroke-width="1.2" opacity="0.65"/>
    <path d="M34.15 44.36 A10.2 10.2 0 0 1 41.36 37.15" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <!-- the graph, embossed into the wax -->
    <g stroke="#e8e9ff" stroke-width="1.8" stroke-linecap="round" fill="#e8e9ff">
      <path d="M44 51.5 L38.5 44 M44 51.5 L49.5 44" fill="none"/>
      <circle cx="44" cy="51.5" r="2.6" stroke="none"/>
      <circle cx="38.2" cy="43.2" r="2.2" stroke="none"/>
      <circle cx="49.8" cy="43.2" r="2.2" stroke="none"/>
    </g>
  </g>
</svg>
