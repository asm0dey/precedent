name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: selftest
        shell: bash
        # The value is double-quoted, which is what keeps it safe on
        # windows-latest. Bash only strips a backslash inside double quotes
        # when the next character is $, `, ", \ or newline — a backslash
        # before an ordinary letter (as in a Windows path) survives quoted.
        # The documented actions/runner footgun (a Windows path's
        # backslashes vanishing) hits an UNQUOTED `${{ github.action_path }}`
        # or `${{ runner.temp }}` substituted straight into the script
        # source; it is the missing quotes that break it, not the choice of
        # `${{ }}` over `$VAR`. Quoted, either form is fine — this uses
        # `$RUNNER_TEMP` (a real env var) simply because it needs no `{{ }}`.
        # The scratch `--home` is not optional either way: a default-home
        # `selftest` would enumerate every real Project node and shell out
        # to `git` in each one's directory (see identity_gaps() in
        # scripts/precedent.py).
        run: uv run scripts/precedent.py --home "${RUNNER_TEMP}/precedent-ci" selftest

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: plugin.json is current
        run: uv run scripts/gen-plugin-json.py --check
