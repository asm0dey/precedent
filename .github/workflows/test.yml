name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# One in-flight run per branch. Superseded PR pushes are cancelled so a
# required check reflects the head commit rather than an older one; pushes to
# main are NOT cancelled, so main keeps an unbroken result history.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selftest:
    # A required check that hangs blocks every merge until someone notices.
    # session-start.ps1 has no internal timeout and uv can stall on the
    # network, so the job carries the bound instead.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1; a SHA, since a tag can be moved
      - name: selftest
        shell: bash
        # The value is double-quoted, which is what keeps it safe on
        # windows-latest. Bash only strips a backslash inside double quotes
        # when the next character is $, `, ", \ or newline — a backslash
        # before an ordinary letter (as in a Windows path) survives quoted.
        # The documented actions/runner footgun (a Windows path's
        # backslashes vanishing) hits an UNQUOTED `${{ github.action_path }}`
        # or `${{ runner.temp }}` substituted straight into the script
        # source; it is the missing quotes that break it, not the choice of
        # `${{ }}` over `$VAR`. Quoted, either form is fine — this uses
        # `$RUNNER_TEMP` (a real env var) simply because it needs no `{{ }}`.
        # The scratch `--home` is not optional either way: a default-home
        # `selftest` would enumerate every real Project node and shell out
        # to `git` in each one's directory (see identity_gaps() in
        # precedent_cli/maintain.py).
        run: uv run adapters/claude/skills/precedent/scripts/precedent.py --home "${RUNNER_TEMP}/precedent-ci" selftest
      - name: hook finds the CLI in every install layout
        shell: bash
        # The hook fails closed: it exits 0 and prints nothing when it cannot
        # resolve the CLI, so an exit-code assertion cannot tell a working
        # hook from a mislocated one. This seeds a store and requires the
        # brief to actually appear, in the repository layout and in the one
        # `acr realize` writes.
        run: bash tests/hook-finds-cli.sh

      - name: hook and statusline agree on the badge marker
        shell: bash
        # Both sides derive the marker's name from the project path on their
        # own, and a mismatch is silent by design — no badge and no error. An
        # exit-code assertion cannot see it, so this asserts the badge itself.
        run: bash tests/statusline-badge.sh

      - name: windows hook adapter finds the CLI
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          PRECEDENT_HOME: ${{ runner.temp }}/precedent-hook-ci
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-hook-ci
        # The hook fails closed, so on an empty store "found nothing to say"
        # and "never found the CLI" both print nothing. Seeding one decision
        # for this directory makes silence mean only the second.
        run: |
          $cli = "${{ github.workspace }}/adapters/claude/skills/precedent/scripts/precedent.py"
          & uv run --quiet $cli record --project "${{ github.workspace }}" `
            --title "ci probe" --scope tooling --topic ci-probe --chose probe `
            --rejected none --rationale "proves the hook resolves the CLI" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "seeding the store failed" }
          $out = (& "${{ github.workspace }}/adapters/claude/hooks/session-start.ps1") -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "session-start.ps1 exited $LASTEXITCODE" }
          if ($out -notmatch 'PRECEDENT') { throw "session-start.ps1 printed no brief: $out" }

      - name: windows statusline adapter runs clean
        if: matrix.os == 'windows-latest'
        shell: pwsh
        # No marker exists for this directory, so the badge is correctly
        # empty; what is asserted is that the script reaches that conclusion
        # rather than throwing on a PowerShell it was not tested against.
        run: |
          $out = '{"workspace":{"current_dir":"C:\\nope"}}' |
            & "${{ github.workspace }}/adapters/claude/hooks/statusline.ps1"
          if ($LASTEXITCODE -ne 0) { throw "statusline.ps1 exited $LASTEXITCODE" }
          if ($out) { throw "statusline.ps1 rendered a badge with no marker: $out" }

  manifest:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1; a SHA, since a tag can be moved
      - name: plugin.json and marketplace.json are current
        # Both are projections of agent-plugin.yaml, and the check also
        # asserts the two adapter paths plugin.json names still exist — a
        # rename there ships an install with no skills and no hook, and
        # breaks nothing else.
        # --locked runs pyyaml at the hashes in gen-plugin-json.py.lock
        # (refresh with `uv lock --script scripts/gen-plugin-json.py`), and
        # --no-build refuses to run a setup script from a source distribution.
        run: uv run --locked --no-build scripts/gen-plugin-json.py --check
